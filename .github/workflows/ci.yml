name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: floodguard
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/floodguard
      DEMO_MODE: "true"
      DEMO_KEY: floodguard-demo
      AUTH_SECRET: ci-secret-0123456789abcdef
      MESSAGING_PROVIDER: mock
      EMAIL_PROVIDER: mock
      OPS_NOTIFY_EMAILS: sema-ops@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run setup
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
